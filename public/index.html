<!DOCTYPE html>
<html lang="en">
<head>

<body>
<header class="topbar">

  </button>

  <a class="brand" href="/" data-link>

      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.8-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14z"/></svg>
    </span>
    <span class="brand-name">TubeStream</span>
  </a>

  <nav class="topnav">
    <a href="/" data-link class="topnav-link">Home</a>
    <a href="/newest" data-link class="topnav-link">Newest</a>
    <a href="/best/weekly" data-link class="topnav-link">Best</a>
    <a href="/categories/amateur" data-link class="topnav-link">Categories</a>

  <form id="searchForm" class="search" autocomplete="off">

    <div id="suggestBox" class="suggest hidden" role="listbox"></div>
  </form>

  <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
